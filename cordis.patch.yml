# dsh-dt-bg 的 bundle 补丁：安装本包后由 DSH 自动应用，把插件挂进 profile。
#
# 一个 insert 行即可 —— 插件本身没有需要改写的既有条目。
#
# ⚠️ `name` 必须是 **web-bg-2**，不能写成 npm 包名 `dsh-dt-bg`：
#    它是插件的「配置命名空间」（见 lib/index.js 的 name 导出），
#    也是用户设置条目的键。写成包名会导致 DSH 认为配置行没有对应实例，
#    配置不再下发给插件 —— 插件退回出厂默认值（壁纸变内置兜底图）。
#
# 用户若想改配置，在自己的 profile cordis.patch.yml 里按 id 覆盖：
#
#   - id: web-bg-2
#     config:
#       enabled: true
#       kind: image
#       image: data:image/jpeg;base64,...
#       translucency: 0.6
#       dim: 0.25
#       scope: all
#
- insert:
    - id: dsh-dt-bg
      name: dsh-dt-bg