# dsh-dt-bg 的 bundle 补丁：安装本包后由 DSH 自动应用，把插件挂进 profile。
#
# 一个 insert 行即可 —— 插件本身没有需要改写的既有条目。
# 用户若想改配置，在自己的 profile cordis.patch.yml 里按 id 覆盖：
#
#   - id: web-bg-2
#     config:
#       enabled: true
#       kind: image
#       image: data:image/jpeg;base64,...
#       translucency: 0.6
#       dim: 0.25
#       scope: all
#
- insert:
    - id: web-bg-2
      name: dsh-dt-bg
